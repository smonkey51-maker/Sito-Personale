name: Localize capability labels once

on:
  push:
    paths:
      - .github/workflows/localize-cap-labels-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localize capability labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          vals={
            'it':('Competenze core','Competenze estese'),
            'en':('Core capabilities','Extended capabilities'),
            'fr':('Compétences clés','Compétences complémentaires')
          }
          def bounds(src,lang):
            m=re.search(rf'^\s{{4}}{lang}\s*:\s*\{{',src,re.M); start=m.start()
            nxt={'it':'en','en':'fr'}.get(lang)
            if nxt:
              m2=re.search(rf'^\s{{4}}{nxt}\s*:\s*\{{',src[m.end():],re.M); end=m.end()+m2.start()
            else:
              m2=re.search(r'^\s{2}\};',src[m.end():],re.M); end=m.end()+m2.start()
            return start,end
          for lang in ('fr','en','it'):
            a,b=bounds(s,lang); block=s[a:b]
            for key,val in [('cap_core_label',vals[lang][0]),('cap_ext_label',vals[lang][1])]:
              pat=rf'(\b{re.escape(key)}\s*:\s*)"(?:\\.|[^"\\])*"'
              block,n=re.subn(pat,lambda m:m.group(1)+'"'+val.replace('"','\\"')+'"',block,count=1)
              if n!=1: raise SystemExit(f'{lang}.{key} not found')
            s=s[:a]+block+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'site-update-bot'
          git config user.email 'site-update-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Localize capability group labels by language'
          git push origin HEAD:main
