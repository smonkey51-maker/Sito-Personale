name: Add political school entry once

on:
  push:
    paths:
      - .github/workflows/add-political-school-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update site
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Insert selective education item between InfoCamere and IdeaGrip.
          anchor = '''    <div class="job-row">\n      <div class="job-overline" data-i18n="t2">2022</div>\n      <div class="job-title">IdeaGrip</div>'''
          entry = '''    <div class="job-row education">\n      <div class="job-overline"><span data-i18n="tpolitica">2026</span><span class="education-tag" data-i18n="politica_tag">Formazione selettiva</span></div>\n      <div class="job-title" data-i18n="politica_title">Meritare l'Europa — Scuola di Formazione Politica, Italia Viva</div>\n      <div class="job-supp" data-i18n="politica_desc">Ammesso al percorso 2026 dedicato alla cittadinanza attiva e all'attività politica istituzionale. Il programma integra geopolitica e futuro dell'Europa, economia e lavoro con focus su innovazione tecnologica e AI, diritti e cittadinanza, comunicazione politica, legislazione e amministrazione, leadership e teamwork.</div>\n    </div>\n'''
          if 'data-i18n="politica_title"' not in s:
              if anchor not in s:
                  raise SystemExit('IdeaGrip anchor not found')
              s = s.replace(anchor, entry + anchor, 1)

          # Visual differentiation from work experience: education, not employment.
          css = '''\n  .job-row.education{border-style:dashed;background:color-mix(in srgb,var(--accent-soft) 42%,transparent);box-shadow:none}\n  .education-tag{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--on-accent-soft);background:var(--accent-soft);border-radius:999px;padding:3px 9px;margin-left:8px}\n'''
          if '.job-row.education{' not in s:
              s = s.replace('\n</style>', css + '\n</style>', 1)

          updates = {
            'it': {
              'tpolitica':'2026',
              'politica_tag':'Formazione selettiva',
              'politica_title':"Meritare l'Europa — Scuola di Formazione Politica, Italia Viva",
              'politica_desc':"Ammesso al percorso 2026 dedicato alla cittadinanza attiva e all'attività politica istituzionale. Il programma integra geopolitica e futuro dell'Europa, economia e lavoro con focus su innovazione tecnologica e AI, diritti e cittadinanza, comunicazione politica, legislazione e amministrazione, leadership e teamwork."
            },
            'en': {
              'tpolitica':'2026',
              'politica_tag':'Selective education',
              'politica_title':"Meritare l'Europa — School of Political Education, Italia Viva",
              'politica_desc':"Admitted to the 2026 program focused on active citizenship and institutional political activity. The curriculum combines geopolitics and the future of Europe, economics and work with a focus on technological innovation and AI, rights and citizenship, political communication, legislation and public administration, leadership and teamwork."
            },
            'fr': {
              'tpolitica':'2026',
              'politica_tag':'Formation sélective',
              'politica_title':"Meritare l'Europa — École de formation politique, Italia Viva",
              'politica_desc':"Admis au programme 2026 consacré à la citoyenneté active et à l'activité politique institutionnelle. Le cursus combine géopolitique et avenir de l'Europe, économie et travail avec un focus sur l'innovation technologique et l'IA, droits et citoyenneté, communication politique, législation et administration publique, leadership et travail en équipe."
            }
          }

          def bounds(src, lang):
              m = re.search(rf'^\s{{4}}{lang}\s*:\s*\{{', src, re.M)
              if not m: raise SystemExit(f'block {lang} not found')
              nxt = {'it':'en','en':'fr'}.get(lang)
              if nxt:
                  m2 = re.search(rf'^\s{{4}}{nxt}\s*:\s*\{{', src[m.end():], re.M)
                  if not m2: raise SystemExit(f'next block after {lang} not found')
                  return m.start(), m.end()+m2.start()
              m2 = re.search(r'^\s{2}\};', src[m.end():], re.M)
              if not m2: raise SystemExit('i18n end not found')
              return m.start(), m.end()+m2.start()

          for lang in ('fr','en','it'):
              st, en = bounds(s, lang)
              block = s[st:en]
              if 'politica_title:' not in block:
                  marker = re.search(r'^\s{6}sec_competenze:', block, re.M)
                  if not marker: raise SystemExit(f'insert marker missing in {lang}')
                  lines = ''.join(f'      {k}:{json.dumps(v, ensure_ascii=False)},\n' for k,v in updates[lang].items())
                  block = block[:marker.start()] + lines + block[marker.start():]
              s = s[:st] + block + s[en:]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Check
        run: |
          grep -q "Meritare l'Europa" index.html
          grep -q 'politica_desc' index.html
          grep -q 'job-row education' index.html
          git diff --check

      - name: Commit and push
        run: |
          git config user.name 'site-update-bot'
          git config user.email 'site-update-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Meritare l Europa political education'
          git push origin HEAD:main
