name: Unify capabilities v2
on:
  push:
    paths:
      - .github/workflows/unify-capabilities-v2.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: echo '' | base64 -d > /tmp/u.py && python /tmp/u.py
      - name: Commit
        run: |
          git config user.name site-update-bot
          git config user.email site-update-bot@users.noreply.github.com
          git add index.html
          git commit -m 'Unify capabilities into one structured section'
          git push origin HEAD:main
