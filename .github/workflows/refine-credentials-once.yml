name: Refine credentials section once

on:
  push:
    paths:
      - .github/workflows/refine-credentials-once.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine credentials section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Replace badge CSS with a single Material 3 credentials container.
          css_new = r'''  /* ============ credentials ============ */
  .credential-list{
    border:1px solid var(--line);
    border-radius:24px;
    overflow:hidden;
    background:color-mix(in srgb,var(--bg) 96%,var(--accent-soft) 4%);
    box-shadow:none;
  }
  .credential-row{
    display:grid;
    grid-template-columns:auto minmax(0,1fr) auto;
    align-items:center;
    gap:14px;
    padding:18px 20px;
    min-width:0;
    transition:background var(--dur-s) var(--ease),transform var(--dur-s) var(--ease);
  }
  .credential-row + .credential-row{border-top:1px solid var(--line)}
  .credential-icon{
    width:36px;height:36px;border-radius:50%;
    background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:800;font-size:13px;flex:none;
  }
  :root[data-theme="dark"] .credential-icon{color:#0B1F57}
  .credential-copy{display:flex;flex-direction:column;gap:3px;min-width:0}
  .credential-title{font-family:var(--display);font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.35}
  .credential-meta{font-family:var(--mono);font-size:10px;letter-spacing:.045em;color:var(--ink-soft);line-height:1.4}
  .credential-arrow{font-family:var(--sans);font-size:22px;line-height:1;color:var(--accent);opacity:.72;transition:transform var(--dur-s) var(--ease),opacity var(--dur-s) var(--ease)}
  @media (hover:hover) and (pointer:fine){
    .credential-row:hover{background:color-mix(in srgb,var(--accent-soft) 34%,transparent)}
    .credential-row:hover .credential-arrow{transform:translateX(3px);opacity:1}
  }
  @media (max-width:560px){
    .credential-list{border-radius:20px}
    .credential-row{padding:16px 17px;gap:12px}
    .credential-icon{width:34px;height:34px;font-size:12px}
    .credential-title{font-size:14px}
    .credential-meta{font-size:9.5px}
  }
'''
          pattern_css = re.compile(r'  /\* ============ badge ============ \*/.*?(?=  /\* ============ selected work ============ \*/)', re.S)
          s, n_css = pattern_css.subn(css_new + '\n', s, count=1)
          if n_css != 1:
              raise SystemExit(f'badge CSS block replacement failed: {n_css}')

          # 2) Replace the three standalone badge cards with one structured list.
          html_new = r'''  <h2 class="section-label rv" id="badge"><span class="section-num">07</span><span data-i18n="sec_badge">Credenziali</span></h2>
  <div class="credential-list rv">
    <a class="credential-row" href="https://www.skills.google/public_profiles/49638d7b-3f49-4712-b70f-f85f5e239519" target="_blank" rel="noopener">
      <span class="credential-icon" aria-hidden="true">G</span>
      <span class="credential-copy">
        <span class="credential-title" data-i18n="badge1_title">Gemini Enterprise Agent Ready</span>
        <span class="credential-meta" data-i18n="badge1_meta">Credential · 2026</span>
      </span>
      <span class="credential-arrow" aria-hidden="true">›</span>
      <span class="visually-hidden" data-i18n="new_tab_hint"> (si apre in una nuova scheda)</span>
    </a>
    <a class="credential-row" href="https://www.skills.google/public_profiles/49638d7b-3f49-4712-b70f-f85f5e239519" target="_blank" rel="noopener">
      <span class="credential-icon" aria-hidden="true">G</span>
      <span class="credential-copy">
        <span class="credential-title" data-i18n="badge3_title">Google Developer Program — Premium Tier</span>
        <span class="credential-meta" data-i18n="badge3_meta">Program status · 2026</span>
      </span>
      <span class="credential-arrow" aria-hidden="true">›</span>
      <span class="visually-hidden" data-i18n="new_tab_hint"> (si apre in una nuova scheda)</span>
    </a>
    <a class="credential-row" href="https://www.skills.google/public_profiles/49638d7b-3f49-4712-b70f-f85f5e239519" target="_blank" rel="noopener">
      <span class="credential-icon" aria-hidden="true">G</span>
      <span class="credential-copy">
        <span class="credential-title" data-i18n="badge2_title">Google Cloud Innovator</span>
        <span class="credential-meta" data-i18n="badge2_meta">Community program · 2025</span>
      </span>
      <span class="credential-arrow" aria-hidden="true">›</span>
      <span class="visually-hidden" data-i18n="new_tab_hint"> (si apre in una nuova scheda)</span>
    </a>
  </div>
'''
          pattern_html = re.compile(r'  <h2 class="section-label rv" id="badge">.*?</div>\n\n(?=  <footer class="rv">)', re.S)
          s, n_html = pattern_html.subn(html_new + '\n', s, count=1)
          if n_html != 1:
              raise SystemExit(f'badge HTML block replacement failed: {n_html}')

          # 3) Localize section heading and simplify metadata in all languages.
          replacements = {
              'sec_badge:"Badge"': 'sec_badge:"Credenziali"',
              'sec_badge:"Badges"': 'sec_badge:"Credentials"',
              'sec_badge:"Badges"': 'sec_badge:"Credentials"',
              'badge1_meta:"Google · Credential · 2026"': 'badge1_meta:"Credential · 2026"',
              'badge2_meta:"Google Cloud · Community program · 2025"': 'badge2_meta:"Community program · 2025"',
              'badge3_meta:"Google · Program status · 2026"': 'badge3_meta:"Program status · 2026"',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          # French may use the same 'Badges' key. Replace only inside the fr block after it starts.
          fr_pos = s.find('    fr: {')
          if fr_pos != -1:
              before, after = s[:fr_pos], s[fr_pos:]
              after = after.replace('sec_badge:"Badges"', 'sec_badge:"Accréditations"', 1)
              after = after.replace('badge1_meta:"Google · Credential · 2026"', 'badge1_meta:"Attestation · 2026"', 1)
              after = after.replace('badge2_meta:"Google Cloud · Community program · 2025"', 'badge2_meta:"Programme communautaire · 2025"', 1)
              after = after.replace('badge3_meta:"Google · Program status · 2026"', 'badge3_meta:"Statut du programme · 2026"', 1)
              s = before + after

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: |
          grep -q 'class="credential-list rv"' index.html
          grep -q 'data-i18n="sec_badge">Credenziali' index.html
          grep -q 'Google Developer Program — Premium Tier' index.html
          git diff --check

      - name: Commit and push
        run: |
          git config user.name 'site-update-bot'
          git config user.email 'site-update-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Redesign badges as professional credentials'
          git push origin HEAD:main
