name: Footer typography once
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use sans typography for footer copyright
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.footer-note{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;color:var(--ink-soft);margin:0}'
          new = '.footer-note{font-family:var(--sans);font-size:12.5px;letter-spacing:0;color:var(--ink-soft);margin:0}'
          if old not in s:
              raise SystemExit('footer-note target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'site-update-bot'
          git config user.email 'site-update-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Use sans typography for footer copyright' || exit 0
          git push origin HEAD:main
