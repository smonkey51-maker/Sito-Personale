name: Generate 4K portrait
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portrait-4k.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Upscale the existing portrait to 4K
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          image = Image.open('portrait-current.webp').convert('RGB')
          image = image.resize((3242, 3840), Image.Resampling.LANCZOS)
          image = image.filter(ImageFilter.UnsharpMask(radius=1.2, percent=105, threshold=3))
          image.save('portrait-4k.webp', 'WEBP', quality=87, method=6)
          assert Image.open('portrait-4k.webp').size == (3242, 3840)
          PY
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portrait-4k.webp
          git diff --cached --quiet || (git commit -m "Generate optimized 4K portrait" && git push)
