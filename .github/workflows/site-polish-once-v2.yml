name: Apply one-time site polish v2

on:
  push:
    paths:
      - .github/workflows/site-polish-once-v2.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply surgical polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def must_sub(pattern, repl, s, count=1, flags=0, label='replacement'):
              out, n = re.subn(pattern, repl, s, count=count, flags=flags)
              if n != count:
                  raise SystemExit(f'{label}: expected {count} replacement(s), got {n}')
              return out

          # Hero crop: preserve more of the institutional Italy/EU context.
          text = text.replace('object-position:center 22%;display:block;box-shadow:none;border:0;border-radius:0;transform:scale(1.15)',
                              'object-position:center 30%;display:block;box-shadow:none;border:0;border-radius:0;transform:scale(1.03)')
          # Remove obsolete hidden role, both CSS and markup.
          text = re.sub(r'^\s*\.hero-role\{[^\n]*\}\s*$', '', text, flags=re.M)
          text = re.sub(r'\n\s*<p class="hero-role">.*?</p>', '', text, count=1, flags=re.S)

          # Narrative section headings while navigation remains short.
          headings = {
              'sintesi': ('02', 'sec_results_title', 'Che risultati ho prodotto'),
              'casi-studio': ('03', 'sec_work_title', 'Cosa ho costruito'),
              'competenze': ('04', 'sec_skills_title', 'Con quali competenze'),
              'percorso': ('05', 'sec_path_title', 'Da quale percorso arrivo'),
              'perspectives': ('06', 'sec_thinking_title', 'Come ragiono'),
          }
          for section_id, (num, key, it_text) in headings.items():
              pat = rf'(<h2 class="section-label rv" id="{re.escape(section_id)}"><span class="section-num">{num}</span><span data-i18n=")[^"]+(">).*?(</span></h2>)'
              text = must_sub(pat, rf'\1{key}\2{it_text}\3', text, label=f'heading {section_id}')

          # Treat international exposure as qualitative proof, not a fourth numeric KPI.
          text = text.replace('<div class="stat" aria-labelledby="p4k" data-card-href="#percorso">',
                              '<div class="stat recognition" aria-labelledby="p4k" data-card-href="#percorso">')
          text = re.sub(r'(<p class="v v-word" data-i18n="p4v">).*?(</p>)', r'\1Europa ↔ Cina\2', text, count=1)
          text = re.sub(r'(<span class="k" id="p4k" data-i18n="p4k">).*?(</span>)', r'\1Esperienza internazionale\2', text, count=1)

          # Surface the new RAG operational manual in the visible proof and case-study summary.
          p5_it = '2 sistemi RAG in produzione presso InfoCamere, con un manuale operativo per Service Desk, Incident & Problem Management e Middle Management.'
          c1_summary_it = 'Due sistemi RAG in produzione per documentazione aziendale e storico Jira, accompagnati da un manuale operativo per Service Desk, Incident & Problem Management e Middle Management.'
          text = re.sub(r'(<p class="d" data-i18n="p5d">).*?(</p>)', lambda m: m.group(1)+p5_it+m.group(2), text, count=1)
          text = re.sub(r'(<p class="work-summary" data-i18n="c1_summary">).*?(</p>)', lambda m: m.group(1)+c1_summary_it+m.group(2), text, count=1)

          updates = {
            'it': {
              'proof_label':'Risultati', 'sec_lavori':'Progetti', 'sec_competenze':'Competenze', 'sec_percorso':'Esperienza', 'sec_perspectives':'Articoli',
              'sec_results_title':'Che risultati ho prodotto', 'sec_work_title':'Cosa ho costruito', 'sec_skills_title':'Con quali competenze', 'sec_path_title':'Da quale percorso arrivo', 'sec_thinking_title':'Come ragiono',
              'p5d':p5_it,
              'p4v':'Europa ↔ Cina', 'p4k':'Esperienza internazionale', 'p4d':'Su invito del CEO di DABO: team SCWL, contest “Sprint Forward”, Shangcheng.',
              'c1_summary':c1_summary_it,
              'c1_solution_3':'Il secondo trasforma lo storico Jira in una knowledge base interrogabile per il team di lavoro, supportando il recupero dell’esperienza accumulata e le attività di Incident & Problem Management. I due RAG sono accompagnati da un manuale operativo strutturato per Service Desk, Incident & Problem Management e Middle Management.'
            },
            'en': {
              'proof_label':'Results', 'sec_lavori':'Projects', 'sec_competenze':'Skills', 'sec_percorso':'Experience', 'sec_perspectives':'Articles',
              'sec_results_title':'What I’ve delivered', 'sec_work_title':'What I’ve built', 'sec_skills_title':'The capabilities behind it', 'sec_path_title':'The path that brought me here', 'sec_thinking_title':'How I think',
              'p5d':'2 RAG systems in production at InfoCamere, with an operational manual for Service Desk, Incident & Problem Management and Middle Management.',
              'p4v':'Europe ↔ China', 'p4k':'International exposure', 'p4d':'At the invitation of DABO’s CEO: SCWL team, “Sprint Forward” contest, Shangcheng.',
              'c1_summary':'Two RAG systems in production for corporate documentation and Jira history, supported by an operational manual for Service Desk, Incident & Problem Management and Middle Management.',
              'c1_solution_3':'The second turns Jira history into a queryable knowledge base for the team, supporting access to accumulated experience and Incident & Problem Management. The two RAG systems are accompanied by an operational manual structured for Service Desk, Incident & Problem Management and Middle Management.'
            },
            'fr': {
              'proof_label':'Résultats', 'sec_lavori':'Projets', 'sec_competenze':'Compétences', 'sec_percorso':'Expérience', 'sec_perspectives':'Articles',
              'sec_results_title':'Ce que j’ai produit', 'sec_work_title':'Ce que j’ai construit', 'sec_skills_title':'Les compétences mobilisées', 'sec_path_title':'Le parcours qui m’a mené ici', 'sec_thinking_title':'Ma façon de penser',
              'p5d':'2 systèmes RAG en production chez InfoCamere, avec un manuel opérationnel pour le Service Desk, l’Incident & Problem Management et le Middle Management.',
              'p4v':'Europe ↔ Chine', 'p4k':'Expérience internationale', 'p4d':'Sur invitation du CEO de DABO : équipe SCWL, concours « Sprint Forward », Shangcheng.',
              'c1_summary':'Deux systèmes RAG en production pour la documentation d’entreprise et l’historique Jira, accompagnés d’un manuel opérationnel pour le Service Desk, l’Incident & Problem Management et le Middle Management.',
              'c1_solution_3':'Le second transforme l’historique Jira en une base de connaissances interrogeable pour l’équipe, facilitant l’accès à l’expérience accumulée et l’Incident & Problem Management. Les deux systèmes RAG sont accompagnés d’un manuel opérationnel structuré pour le Service Desk, l’Incident & Problem Management et le Middle Management.'
            }
          }

          def block_bounds(src, lang):
              m = re.search(rf'^\s{{4}}{lang}\s*:\s*\{{', src, flags=re.M)
              if not m:
                  raise SystemExit(f'i18n block not found: {lang}')
              start = m.start()
              next_lang = {'it':'en','en':'fr'}.get(lang)
              if next_lang:
                  m2 = re.search(rf'^\s{{4}}{next_lang}\s*:\s*\{{', src[m.end():], flags=re.M)
                  if not m2:
                      raise SystemExit(f'next i18n block not found after {lang}')
                  end = m.end() + m2.start()
              else:
                  m2 = re.search(r'^\s{2}\};', src[m.end():], flags=re.M)
                  if not m2:
                      raise SystemExit('i18n object end not found')
                  end = m.end() + m2.start()
              return start, end

          def set_existing(block, key, value):
              pattern = rf'(\b{re.escape(key)}\s*:\s*)"(?:\\.|[^"\\])*"'
              block2, n = re.subn(pattern, lambda m: m.group(1)+json.dumps(value, ensure_ascii=False), block, count=1)
              if n != 1:
                  raise SystemExit(f'key not found in block: {key}')
              return block2

          title_keys = ['sec_results_title','sec_work_title','sec_skills_title','sec_path_title','sec_thinking_title']
          for lang in ('fr','en','it'):
              start, end = block_bounds(text, lang)
              block = text[start:end]
              if 'sec_results_title:' not in block:
                  match = re.search(r'^\s{6}proof_label:', block, flags=re.M)
                  if not match:
                      raise SystemExit(f'proof_label marker missing in {lang}')
                  lines = ''.join(f'      {k}:{json.dumps(updates[lang][k], ensure_ascii=False)},\n' for k in title_keys)
                  block = block[:match.start()] + lines + block[match.start():]
              for key, value in updates[lang].items():
                  block = set_existing(block, key, value)
              text = text[:start] + block + text[end:]

          polish_css = r'''

          /* ============ 2026-09 surgical polish ============ */
          .stat.recognition{
            background:transparent;
            border:1px solid color-mix(in srgb,var(--accent) 34%,var(--line) 66%);
            box-shadow:none;
          }
          .stat.recognition .v{font-size:24px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
          .stat.recognition .k{color:var(--ink-soft)}
          @media (hover:hover) and (pointer:fine){
            .stat.recognition:hover{background:color-mix(in srgb,var(--accent-soft) 45%,transparent);box-shadow:var(--shadow)}
          }

          .hero{padding-bottom:48px}
          #chi-sono.section-label{padding-top:32px}
          .section-label{padding-top:56px;padding-bottom:24px}

          @media (max-width:900px){
            .hero{padding:24px 0 28px}
            .section-label{padding-top:40px;padding-bottom:20px}
            #chi-sono.section-label{padding-top:26px}
            .chisono-card{padding:28px}
          }

          @media (max-width:560px){
            .hero-toprow{padding:28px 24px 30px}
            .hero-cta-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}
            .hero-cta-row .hero-btn{width:100%;min-height:48px;justify-content:center;text-align:center;padding:11px 14px}
            .hero-cta-row .hero-btn.solid{grid-column:1 / -1}
            .hero-nav{gap:10px;margin-top:30px;padding-top:22px}
            .hero-nav a{padding:7px 12px}
            .section-label{font-size:22px;line-height:1.2;gap:10px}
            .chisono-card{padding:26px 24px;border-radius:24px}
            .stat{padding:26px 24px;border-radius:24px}
            .stat.recognition .v{font-size:23px}
          }
          '''
          if '2026-09 surgical polish' not in text:
              text = text.replace('\n</style>', polish_css + '\n</style>', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Sanity checks
        shell: bash
        run: |
          grep -q 'Che risultati ho prodotto' index.html
          grep -q 'Cosa ho costruito' index.html
          grep -q 'Con quali competenze' index.html
          grep -q 'Da quale percorso arrivo' index.html
          grep -q 'Come ragiono' index.html
          grep -q 'manuale operativo per Service Desk' index.html
          grep -q 'stat recognition' index.html
          ! grep -q '<p class="hero-role">' index.html
          ! grep -q 'scale(1.15)' index.html
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'site-polish-bot'
          git config user.email 'site-polish-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Polish hero, section narrative, evidence and spacing'
          git push origin HEAD:main
