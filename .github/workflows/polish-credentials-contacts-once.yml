name: Polish credentials and contacts once
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align credentials and contacts components
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Make contact rows use the exact same geometry and interaction language as credentials.
          old_css = '''  .contact-list{border:1px solid var(--line);border-radius:24px;overflow:hidden;background:color-mix(in srgb,var(--bg) 96%,var(--accent-soft) 4%);box-shadow:none}
  .contact-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;min-width:0;min-height:72px;padding:16px 20px;color:var(--ink);background:transparent;border:0;width:100%;text-align:left;cursor:pointer;font:inherit;transition:background var(--dur-s) var(--ease),transform var(--dur-s) var(--ease)}
  .contact-row + .contact-row{border-top:1px solid var(--line)}
  .contact-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink-soft)}
  .contact-icon svg{width:21px;height:21px}
  .contact-icon.contact-g{background:var(--accent);color:#fff;font-family:var(--display);font-size:12px;font-weight:800}
  :root[data-theme="dark"] .contact-icon.contact-g{color:#0B1F57}
  .contact-label{font-family:var(--display);font-size:15px;font-weight:700;line-height:1.25;color:var(--ink)}
  .contact-arrow{font-family:var(--sans);font-size:22px;line-height:1;color:var(--accent);opacity:.78;transition:transform var(--dur-s) var(--ease),opacity var(--dur-s) var(--ease)}
  @media (hover:hover) and (pointer:fine){.contact-row:hover{background:color-mix(in srgb,var(--accent-soft) 34%,transparent)}.contact-row:hover .contact-arrow{transform:translateX(3px);opacity:1}}
  @media (max-width:560px){.contact-list{border-radius:20px}.contact-row{min-height:68px;padding:15px 17px;gap:12px}.contact-icon{width:34px;height:34px}.contact-label{font-size:14.5px}}'''
          new_css = '''  .contact-list{border:1px solid var(--line);border-radius:24px;overflow:hidden;background:color-mix(in srgb,var(--bg) 96%,var(--accent-soft) 4%);box-shadow:none}
  .contact-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:18px 20px;min-width:0;color:var(--ink);background:transparent;border:0;width:100%;text-align:left;cursor:pointer;font:inherit;transition:background var(--dur-s) var(--ease)}
  .contact-row + .contact-row{border-top:1px solid var(--line)}
  .contact-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 58%,transparent)}
  .contact-icon svg{width:21px;height:21px}
  .contact-copy{display:flex;flex-direction:column;gap:3px;min-width:0}
  .contact-label{font-family:var(--display);font-size:14.5px;font-weight:700;line-height:1.35;color:var(--ink)}
  .contact-meta{font-family:var(--mono);font-size:10px;letter-spacing:.045em;color:var(--ink-soft);line-height:1.4}
  .contact-arrow{font-family:var(--sans);font-size:22px;line-height:1;color:var(--accent);opacity:.72;transition:transform var(--dur-s) var(--ease),opacity var(--dur-s) var(--ease)}
  @media (hover:hover) and (pointer:fine){.contact-row:hover{background:color-mix(in srgb,var(--accent-soft) 34%,transparent)}.contact-row:hover .contact-arrow{transform:translateX(3px);opacity:1}}
  @media (max-width:560px){.contact-list{border-radius:20px}.contact-row{padding:16px 17px;gap:12px}.contact-icon{width:34px;height:34px}.contact-label{font-size:14px}.contact-meta{font-size:9.5px}}'''
          if old_css not in s:
              raise SystemExit('contact CSS target not found')
          s = s.replace(old_css, new_css, 1)

          # Add secondary descriptions so Contacts mirrors Credentials structurally.
          s = s.replace(
              '<span class="contact-label">LinkedIn</span><span class="contact-arrow" aria-hidden="true">&gt;</span>',
              '<span class="contact-copy"><span class="contact-label">LinkedIn</span><span class="contact-meta" data-i18n="contact_linkedin_meta">Profilo professionale</span></span><span class="contact-arrow" aria-hidden="true">&gt;</span>',
              1
          )
          s = s.replace(
              '<span class="contact-label">Email</span><span class="contact-arrow" aria-hidden="true">&gt;</span>',
              '<span class="contact-copy"><span class="contact-label">Email</span><span class="contact-meta" data-i18n="contact_email_meta">Contatto diretto</span></span><span class="contact-arrow" aria-hidden="true">&gt;</span>',
              1
          )
          s = s.replace(
              '<span class="contact-label">Google Skills</span><span class="contact-arrow" aria-hidden="true">&gt;</span>',
              '<span class="contact-copy"><span class="contact-label">Google Skills</span><span class="contact-meta" data-i18n="contact_skills_meta">Certificazioni e learning profile</span></span><span class="contact-arrow" aria-hidden="true">&gt;</span>',
              1
          )

          # Localize the three secondary labels.
          s = s.replace('sec_badge:"Credenziali",sec_contacts:"Contatti",', 'sec_badge:"Credenziali",sec_contacts:"Contatti", contact_linkedin_meta:"Profilo professionale", contact_email_meta:"Contatto diretto", contact_skills_meta:"Certificazioni e learning profile",', 1)
          s = s.replace('sec_badge:"Credentials",sec_contacts:"Contacts",', 'sec_badge:"Credentials",sec_contacts:"Contacts", contact_linkedin_meta:"Professional profile", contact_email_meta:"Direct contact", contact_skills_meta:"Credentials and learning profile",', 1)
          s = s.replace('sec_badge:"Identifiants",sec_contacts:"Contacts",', 'sec_badge:"Identifiants",sec_contacts:"Contacts", contact_linkedin_meta:"Profil professionnel", contact_email_meta:"Contact direct", contact_skills_meta:"Certifications et profil de formation",', 1)

          # If the French heading uses a different existing translation, add the metadata immediately after sec_contacts.
          if 'contact_linkedin_meta:"Profil professionnel"' not in s:
              s = re.sub(r'(sec_badge:"[^"]+",sec_contacts:"Contacts",)', r'\1 contact_linkedin_meta:"Profil professionnel", contact_email_meta:"Contact direct", contact_skills_meta:"Certifications et profil de formation",', s, count=1)

          # Slightly tighter end-of-page closure now that Contacts is a real section.
          s += '\n<style>footer{padding-bottom:52px}@media(max-width:900px){footer{padding-bottom:48px}}</style>\n'

          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'site-update-bot'
          git config user.email 'site-update-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Align credentials and contacts components' || exit 0
          git push origin HEAD:main
