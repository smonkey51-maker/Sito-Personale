name: Final mobile polish once
on: [push]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply polish
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/polish.py
          python /tmp/polish.py
          git diff --check
          git config user.name 'site-update-bot'
          git config user.email 'site-update-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Polish mobile contrast spacing and contact FAB' || exit 0
          git push origin HEAD:main
