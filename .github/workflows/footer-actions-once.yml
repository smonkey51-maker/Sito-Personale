name: Footer actions once
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update footer actions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          css=r'''

  /* ============ Material 3 action footer ============ */
  .footer-links{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .footer-action{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    min-height:44px;
    padding:10px 15px;
    border:1px solid var(--line);
    border-radius:999px;
    background:color-mix(in srgb,var(--bg) 94%,var(--accent-soft) 6%);
    color:var(--ink);
    font:600 13px/1 var(--sans);
    cursor:pointer;
    transition:background var(--dur-s) var(--ease),border-color var(--dur-s) var(--ease),color var(--dur-s) var(--ease),transform var(--dur-s) var(--ease),box-shadow var(--dur-s) var(--ease);
  }
  .footer-action svg{width:17px;height:17px;flex:none}
  .footer-action .footer-g{
    width:21px;height:21px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    background:var(--accent);color:#fff;font-family:var(--display);font-size:10px;font-weight:800;flex:none;
  }
  :root[data-theme="dark"] .footer-action .footer-g{color:#0B1F57}
  .footer-external{font-size:15px;line-height:1;color:var(--accent);opacity:.8}
  @media (hover:hover) and (pointer:fine){
    .footer-action:hover{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 32%,var(--line) 68%);color:var(--ink);box-shadow:var(--shadow)}
    .footer-action:hover .footer-external{opacity:1;transform:translate(1px,-1px)}
  }
  .footer-note{margin-top:18px}
  @media (max-width:560px){
    .footer-links{display:grid;grid-template-columns:1fr;gap:9px}
    .footer-action{width:100%;justify-content:flex-start;padding:12px 15px;border-radius:16px}
    .footer-external{margin-left:auto}
  }
'''
          marker='/* ============ Material 3 action footer ============ */'
          if marker not in s:
              s=s.replace('\n</style>',css+'\n</style>',1)

          new=r'''  <footer class="rv">
    <div class="footer-links">
      <a class="footer-action md-ripple-wrapper" href="https://www.linkedin.com/in/nicoloforcolin/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 10v6M8 8h.01M12 16v-3.5a2.5 2.5 0 0 1 5 0V16M12 10v6"/></svg>
        <span>LinkedIn</span><span class="footer-external" aria-hidden="true">↗</span>
        <span class="visually-hidden" data-i18n="new_tab_hint"> (si apre in una nuova scheda)</span>
      </a>
      <button class="footer-action md-ripple-wrapper" type="button" data-open-contacts>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 6 10 7L22 6"/></svg>
        <span>Email</span>
      </button>
      <a class="footer-action md-ripple-wrapper" href="https://www.skills.google/public_profiles/49638d7b-3f49-4712-b70f-f85f5e239519" target="_blank" rel="noopener">
        <span class="footer-g" aria-hidden="true">G</span>
        <span>Google Skills</span><span class="footer-external" aria-hidden="true">↗</span>
        <span class="visually-hidden" data-i18n="new_tab_hint"> (si apre in una nuova scheda)</span>
      </a>
    </div>
    <p class="footer-note">© 2026 Nicolò Forcolin — Padova, Italia</p>
  </footer>'''
          pat=re.compile(r'  <footer class="rv">.*?</footer>',re.S)
          s,n=pat.subn(new,s,count=1)
          if n!=1: raise SystemExit(f'footer replacement failed: {n}')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'site-update-bot'
          git config user.email 'site-update-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Redesign footer links as Material 3 actions'
          git push origin HEAD:main
