name: Footer actions once
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply footer redesign
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/footer.py
          python /tmp/footer.py
          git diff --check
          git config user.name 'site-update-bot'
          git config user.email 'site-update-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Redesign footer links as Material 3 actions' || exit 0
          git push origin HEAD:main
